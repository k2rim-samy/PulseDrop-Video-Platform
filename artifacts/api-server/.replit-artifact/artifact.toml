kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd \"$(git rev-parse --show-toplevel)/artifacts/api-server/python\" && uv run uvicorn pulsedrop_server:app --host 0.0.0.0 --port $PORT"

[services.production]

[services.production.build]
args = ["uv", "sync", "--locked"]

[services.production.build.env]
UV_PROJECT_ENVIRONMENT = ".pythonlibs"

[services.production.run]
args = ["uv", "run", "uvicorn", "--app-dir", "artifacts/api-server/python", "pulsedrop_server:app", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
